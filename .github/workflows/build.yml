name: Build CarLyrics IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package CarLyrics IPA
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version & List Schemes
        run: |
          xcodebuild -version
          xcodebuild -project CarLyrics.xcodeproj -list

      - name: Build iOS App & Widget (Ad-Hoc Signed for Device)
        run: |
          xcodebuild -project CarLyrics.xcodeproj \
                     -scheme CarLyrics \
                     -configuration Release \
                     -sdk iphoneos \
                     -derivedDataPath build \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     clean build

      - name: Package into IPA
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/CarLyrics.app Payload/
          zip -r CarLyrics.ipa Payload
          rm -rf Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLyrics-iOS-App
          path: CarLyrics.ipa
          retention-days: 14
