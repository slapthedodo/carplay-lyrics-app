name: Build CarLyrics IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package CarLyrics
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Xcode Version & List Schemes
        run: |
          xcodebuild -version
          xcodebuild -project CarLyrics.xcodeproj -list

      - name: Build CarLyrics App & Widgets (Ad-Hoc Signed)
        run: |
          set -o pipefail
          xcodebuild -project CarLyrics.xcodeproj \
                     -scheme CarLyrics \
                     -configuration Release \
                     -destination 'generic/platform=iOS' \
                     -derivedDataPath build_carlyrics \
                     CODE_SIGN_STYLE=Manual \
                     CODE_SIGN_IDENTITY="-" \
                     CODE_SIGNING_REQUIRED=NO \
                     AD_HOC_CODE_SIGNING_ALLOWED=YES \
                     PROVISIONING_PROFILE_SPECIFIER="" \
                     clean build

      - name: Package CarLyrics IPA
        run: |
          rm -rf Payload
          mkdir -p Payload
          cp -r build_carlyrics/Build/Products/Release-iphoneos/CarLyrics.app Payload/
          zip -r CarLyrics.ipa Payload
          rm -rf Payload

      - name: Upload CarLyrics IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarLyrics-iOS-App
          path: CarLyrics.ipa
          retention-days: 14

      - name: Create or Update GitHub Release for Direct IPA Download
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: latest
          name: CarLyrics Latest Release
          draft: false
          prerelease: false
          files: |
            CarLyrics.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
